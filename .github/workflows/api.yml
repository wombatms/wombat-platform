name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/mcp-server/**"
      - "migrations/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/mcp-server/**"
      - "migrations/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api.yml"

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint (ruff check + ruff format --check)
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  # ─────────────────────────────────────────────────────────────────
  # 2. Unit tests (aiosqlite in-memory, no Postgres required)
  # ─────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: .coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # 3. Integration tests — requires Postgres + pgvector
  #    Includes: moto-S3 evidence e2e (no real AWS creds needed —
  #    moto patches boto3 in-process).
  # ─────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests (Postgres + moto-S3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: wombat_test
          POSTGRES_USER: wombat
          POSTGRES_PASSWORD: wombat_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      WOMBAT_TEST_DATABASE_URL: "postgresql+asyncpg://wombat:wombat_test_pw@localhost:5432/wombat_test"
      WOMBAT_DATABASE_URL: "postgresql+asyncpg://wombat:wombat_test_pw@localhost:5432/wombat_test"
      # Evidence backend: use LocalFS for integration tests so no AWS creds needed.
      # moto-parametrized tests in test_evidence_e2e.py mock boto3 in-process via
      # the @mock_s3 decorator — they run without any real AWS credentials.
      WOMBAT_EVIDENCE_BACKEND: "localfs"
      WOMBAT_EVIDENCE_LOCALFS_ROOT: "/tmp/wombat-evidence-test"
      WOMBAT_SIGNED_EVIDENCE_SECRET: "ci-test-secret-key-for-hmac"
      # JWT / auth settings
      JWT_SECRET_KEY: "ci-test-jwt-secret-key-at-least-32-chars"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (including moto[s3] from dev group)
        # uv sync --dev pulls in moto[s3], testcontainers, pytest, etc.
        # WOMBAT_TEST_DATABASE_URL is set so testcontainers is NOT used;
        # the CI-managed Postgres service above is used directly.
        run: uv sync --dev

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        # test_evidence_backends.py (unit) covers LocalFSBackend + S3Backend
        # with moto via @mock_aws.  test_evidence_e2e.py (integration) exercises
        # the full HTTP path including upload, presign, and byte-level download.
        run: uv run pytest tests/integration -q --tb=short

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: .coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # 4. Coverage gate — unit + integration combined ≥ 70 %
  # ─────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage gate (≥70%)
    needs: [unit, integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: wombat_test
          POSTGRES_USER: wombat
          POSTGRES_PASSWORD: wombat_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      WOMBAT_TEST_DATABASE_URL: "postgresql+asyncpg://wombat:wombat_test_pw@localhost:5432/wombat_test"
      WOMBAT_DATABASE_URL: "postgresql+asyncpg://wombat:wombat_test_pw@localhost:5432/wombat_test"
      WOMBAT_EVIDENCE_BACKEND: "localfs"
      WOMBAT_EVIDENCE_LOCALFS_ROOT: "/tmp/wombat-evidence-test"
      WOMBAT_SIGNED_EVIDENCE_SECRET: "ci-test-secret-key-for-hmac"
      JWT_SECRET_KEY: "ci-test-jwt-secret-key-at-least-32-chars"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Run full test suite with coverage
        run: |
          uv run pytest tests/ -q --tb=short \
            --cov=packages/api/src \
            --cov=packages/core/src \
            --cov=packages/cli/src \
            --cov=packages/mcp-server/src \
            --cov-report=term-missing \
            --cov-fail-under=70
