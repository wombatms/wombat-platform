[project]
name = "wombat-cli"
version = "0.1.0"
description = "CLI for Wombat test case management"
requires-python = ">=3.12"
dependencies = [
    "wombat-core",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
wombat = "wombat_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wombat_cli"]

[tool.uv.sources]
wombat-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
