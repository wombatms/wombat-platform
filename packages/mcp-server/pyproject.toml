[project]
name = "wombat-mcp"
version = "0.1.0"
description = "Stdio MCP server for Wombat test case management"
requires-python = ">=3.12"
dependencies = [
    "wombat-core",
    "httpx>=0.27",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wombat_mcp"]

[tool.uv.sources]
wombat-core = { workspace = true }

[project.scripts]
wombat-mcp = "wombat_mcp.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.4",
]
