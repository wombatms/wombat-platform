[project]
name = "wombat-api"
version = "0.1.0"
description = "FastAPI backend for Wombat test case management"
requires-python = ">=3.12"
dependencies = [
    "wombat-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "gitpython>=3.1",
    "pypdf>=5.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wombat_api"]

[tool.uv.sources]
wombat-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]
