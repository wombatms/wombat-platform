- wombat_id: "TC-AUTH-001"
  title: "User can log in with valid credentials"
  kind: testcase
  component: auth
  priority: high
  tags: [smoke, login, auth]
  automation: automated
  body: |
    ## Description
    Verify that a registered user can log in with valid email and password.

    ## Steps
    1. Navigate to `/login`
    2. Enter valid email address
    3. Enter valid password
    4. Click "Sign in"

    ## Expected
    User is redirected to the project library.

- wombat_id: "TC-AUTH-002"
  title: "Login fails with invalid password"
  kind: testcase
  component: auth
  priority: high
  tags: [auth, negative]
  automation: automated
  body: |
    ## Description
    Verify that login with an incorrect password shows an error.

    ## Steps
    1. Navigate to `/login`
    2. Enter valid email
    3. Enter wrong password
    4. Click "Sign in"

    ## Expected
    Error message "Invalid email or password" is displayed.

