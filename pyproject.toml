[project]
name = "wombat-platform"
version = "0.1.0"
description = "Agent-friendly test case management platform"
requires-python = ">=3.12"

dependencies = [
    "wombat-core",
    "wombat-cli",
    "wombat-api",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wombat-core = { workspace = true }
wombat-cli = { workspace = true }
wombat-api = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
