[project]
name = "wombat-platform"
version = "0.1.0"
description = "Agent-friendly test case management platform"
requires-python = ">=3.12"

dependencies = [
    "wombat-core",
    "wombat-cli",
    "wombat-api",
    "wombat-mcp",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wombat-core = { workspace = true }
wombat-cli = { workspace = true }
wombat-api = { workspace = true }
wombat-mcp = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "reportlab>=4.0",
    "respx>=0.23.1",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# B008: Do not perform function calls in argument defaults.
# FastAPI uses Depends()/Query()/File() in default arguments by design;
# this rule produces false positives for all FastAPI route signatures.
# We suppress it project-wide since every route file triggers it.
ignore = ["B008"]
select = ["E", "F", "B", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migration files: imports are intentionally structured for Alembic conventions.
"migrations/*" = ["E402", "I001"]
# Test files: unused variables in pytest fixtures are common patterns.
"tests/*" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "postgres: marks tests that require a live Postgres instance (skip unless WOMBAT_TEST_DATABASE_URL is set)",
    "slow: marks tests that take longer than usual (full E2E pipelines, large fixtures)",
]
